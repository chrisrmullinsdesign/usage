name: Bug report
description: Something in the app misbehaves
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Please don't paste your log file without reading it first.**
        `~/Library/Logs/ClaudeUsage.log` holds no tokens, but it does list your usage
        percentages and message counts. Redact anything you'd rather not publish.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: From the DMG filename, or the Info.plist in the bundle.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: "macOS 15.1, Apple M2"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines (optional)
      render: text
